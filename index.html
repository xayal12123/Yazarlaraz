<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoirPRO — DGB Faucet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root { --bg: #050508; --gold: #FFC107; --card: #0f0f18; --text: #fff; --border: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Auth Screen */
        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--card); padding: 40px 30px; border-radius: 35px; width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 16px; margin: 15px 0; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: #12121f; color: #fff; outline: none; text-align: center; font-size: 15px; }

        /* App Layout */
        #app-content { display: none; }
        header { padding: 18px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(5,5,8,0.9); backdrop-filter: blur(12px); z-index: 1000; }
        .bal-badge { background: rgba(255,193,7,0.1); padding: 8px 16px; border-radius: 14px; color: var(--gold); font-weight: 800; border: 1px solid rgba(255,193,7,0.2); }

        .container { max-width: 480px; margin: auto; padding: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid var(--border); margin-bottom: 18px; text-align: center; }
        
        .btn { background: linear-gradient(135deg, #FFC107, #FF8F00); color: #000; border: none; padding: 16px; width: 100%; border-radius: 16px; font-weight: 900; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(255,193,7,0.2); }
        .btn:disabled { background: #1d1d2b; color: #444; box-shadow: none; cursor: not-allowed; }

        .nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0f; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { font-size: 20px; cursor: pointer; opacity: 0.5; }
        .nav-item.active { opacity: 1; color: var(--gold); }

        .tab { display: none; } .active-tab { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .g-recaptcha { display: flex; justify-content: center; margin: 15px 0; transform: scale(0.9); }
    </style>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <div class="auth-card">
        <h1 style="color:var(--gold); font-size: 38px; margin: 0 0 10px 0; font-weight: 900;">NoirPRO</h1>
        <p style="opacity:0.6; font-size:13px; margin-bottom: 25px;">FaucetPay Emailinizlə daxil olun</p>
        <input type="email" id="fp-email" placeholder="misal@gmail.com">
        <button class="btn" onclick="login()">DAXİL OL</button>
    </div>
</div>

<div id="app-content">
    <header>
        <span style="font-weight:900; color:var(--gold); font-size: 20px;">NoirPRO</span>
        <div class="bal-badge">💰 <span id="userBal">0.00</span> DGB</div>
    </header>

    <div class="container">
        <div id="home-tab" class="tab active-tab">
            <div class="card">
                <h3 style="margin-top:0; opacity:0.7">Manual Faucet</h3>
                <h1 id="timer" style="color:var(--gold); font-size:60px; margin:15px 0; font-weight: 900;">05:00</h1>
                
                <div class="g-recaptcha" data-sitekey="6LenAtgsAAAAAKXFw4vLd3USFYnF46qIOTcanRSS" data-theme="dark"></div>
                
                <button id="claimBtn" class="btn" onclick="verifyAndClaim()">0.05 DGB GÖTÜR</button>
            </div>
        </div>

        <div id="wd-tab" class="tab">
            <div class="card">
                <h3 style="margin-top:0;">Çıxarış (Withdraw)</h3>
                <p style="font-size:13px; opacity:0.6;">Minimum Limit: 10 DGB</p>
                <h2 id="wdBal" style="color:var(--gold); font-size: 32px; margin: 20px 0;">0.00 DGB</h2>
                <button class="btn" onclick="requestWD()">İSTƏK GÖNDƏR</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home-tab', this)">🏠</div>
        <div class="nav-item" onclick="showTab('wd-tab', this)">💳</div>
        <div class="nav-item" onclick="logout()">🚪</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<script>
// Firebase Konfiqurasiya
const firebaseConfig = {
  apiKey: "AIzaSyDy-I6C7r9Js_OZqPlSj__d-bYGB-c0yXs",
  authDomain: "faucetfirex.firebaseapp.com",
  projectId: "faucetfirex",
  storageBucket: "faucetfirex.firebasestorage.app",
  messagingSenderId: "191065358342",
  appId: "1:191065358342:web:b9911c6e71b9fc4b254387"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(), auth = firebase.auth();
let currentEmail = localStorage.getItem("fp_email");

async function login() {
    const email = document.getElementById('fp-email').value;
    if(!email.includes("@")) return alert("Düzgün FaucetPay emailinizi yazın!");
    localStorage.setItem("fp_email", email);
    await auth.signInAnonymously();
    location.reload();
}

function logout() { localStorage.clear(); auth.signOut(); location.reload(); }

auth.onAuthStateChanged(user => {
    if (user && currentEmail) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        db.collection("users").doc(currentEmail).onSnapshot(doc => {
            if (doc.exists) {
                const bal = doc.data().tarazlıq || 0;
                document.getElementById('userBal').innerText = bal.toFixed(2);
                document.getElementById('wdBal').innerText = bal.toFixed(2) + " DGB";
                updateTimer(doc.data().son_faucet || 0);
            } else db.collection("users").doc(currentEmail).set({ tarazlıq: 0, son_faucet: 0 });
        });
    }
});

async function verifyAndClaim() {
    const response = grecaptcha.getResponse();
    if (response.length == 0) return alert("Robot olmadığınızı təsdiqləyin!");

    await db.collection("users").doc(currentEmail).update({ 
        tarazlıq: firebase.firestore.FieldValue.increment(0.05),
        son_faucet: Date.now() 
    });

    grecaptcha.reset();
    alert("Təbriklər! +0.05 DGB balansınıza əlavə edildi.");
}

async function requestWD() {
    const doc = await db.collection("users").doc(currentEmail).get();
    const bal = doc.data().tarazlıq || 0;
    if(bal < 10) return alert("Minimum 10 DGB lazımdır!");

    await db.collection("withdraw_requests").add({
        email: currentEmail, miqdar: bal, tarix: new Date().toLocaleString(), status: "Gözləmədə"
    });
    await db.collection("users").doc(currentEmail).update({ tarazlıq: 0 });
    alert("Çıxarış istəyi qeydə alındı.");
}

function showTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active-tab'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active-tab');
    el.classList.add('active');
}

function updateTimer(last) {
    const tick = setInterval(() => {
        const diff = (5 * 60 * 1000) - (Date.now() - last);
        const btn = document.getElementById('claimBtn'), txt = document.getElementById('timer'), cap = document.querySelector('.g-recaptcha');
        if (diff <= 0) { 
            btn.disabled = false; txt.innerText = "HAZIR"; cap.style.visibility = "visible";
            clearInterval(tick);
        } else {
            btn.disabled = true; cap.style.visibility = "hidden";
            const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
            txt.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    }, 1000);
}
</script>
</body>
</html>
