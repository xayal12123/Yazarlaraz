<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>yazarlar.az — Bestseller Platforması</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507; --panel:#0c0c12; --gold:#FFC107; --orange:#FF6F00;
  --text:#EDEDF3; --muted:#9a9aab; --border:rgba(255,255,255,.1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter', sans-serif; background:var(--bg); color:var(--text);
  margin:0; padding:0; overflow-x:hidden; -webkit-user-select: none; user-select: none;
}
img { -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: none; }

.bg-glow{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
.bg-glow div{position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(80px); opacity:0.3}
.bg-glow div:nth-child(1){top:-10%; left:-10%; background:var(--orange)}
.bg-glow div:nth-child(2){bottom:-10%; right:-10%; background:var(--gold)}

.header{position:sticky; top:0; z-index:100; background:rgba(5,5,7,0.8); backdrop-filter:blur(15px); border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px; margin:0 auto; padding:15px 20px; display:flex; align-items:center; justify-content:space-between}
.logo{font-weight:900; font-size:22px; color:var(--gold); letter-spacing:-1px}

.btn{border:0; cursor:pointer; font-family:inherit; font-weight:700; padding:12px 20px; border-radius:14px; transition:0.2s; display:inline-flex; align-items:center; gap:8px; font-size:14px}
.btn-primary{background:linear-gradient(135deg, var(--gold), var(--orange)); color:#000}
.btn-outline{background:rgba(255,255,255,0.05); color:#fff; border:1px solid var(--border)}

.section{max-width:1200px; margin:0 auto; padding:20px; display:none}
.section.active{display:block}

.hero{text-align:center; padding:30px 20px; max-width:800px; margin:0 auto}
.stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:20px 0}
.stat-card{background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:15px; border-radius:18px; text-align:center}
.stat-num{font-size:22px; font-weight:900; color:var(--gold); display:block}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:15px}
.book-card{background:var(--panel); border:1px solid var(--border); border-radius:20px; overflow:hidden; position:relative}
.img-shield{position:absolute; inset:0; z-index:5; background:transparent}

/* Bestseller Badge */
.badge{position:absolute; top:10px; left:10px; background:var(--gold); color:#000; padding:4px 8px; border-radius:8px; font-size:10px; font-weight:900; z-index:6; box-shadow:0 4px 10px rgba(0,0,0,0.5)}

.book-img{width:100%; aspect-ratio:3/4; object-fit:cover; background:#111; display:block}
.book-info{padding:12px}
.book-title{font-weight:700; font-size:14px; margin-bottom:5px; height:36px; overflow:hidden}
.book-price{color:var(--gold); font-weight:800; font-size:16px}
.book-sales{font-size:11px; color:var(--muted); margin-top:4px}

.modal{position:fixed; inset:0; background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); display:none; place-items:center; z-index:200; padding:20px}
.modal.open{display:grid}
.modal-content{background:var(--panel); border:1px solid var(--border); width:100%; max-width:400px; padding:25px; border-radius:24px; position:relative}

.form-group{margin-bottom:15px}
.form-group input{width:100%; padding:14px; background:#16161f; border:1px solid var(--border); border-radius:12px; color:#fff; outline:none}

.tabbar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(12,12,18,0.9); backdrop-filter:blur(15px); border:1px solid var(--border); padding:8px; border-radius:22px; display:flex; gap:10px; z-index:90}
.tab-btn{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; color:var(--muted); cursor:pointer}
.tab-btn.active{background:var(--gold); color:#000}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; padding:12px 24px; border-radius:12px; font-weight:800; z-index:300; display:none}
.hidden{display:none}
</style>
</head>
<body oncontextmenu="return false;">

<div class="bg-glow"><div></div><div></div></div>

<header class="header">
  <div class="header-inner">
    <div class="logo">yazarlar<span>.az</span></div>
    <div id="authHeader"><button class="btn btn-outline" onclick="openModal('loginModal')">Giriş</button></div>
    <div id="userHeader" class="hidden">
      <div style="display:flex; align-items:center; gap:12px">
        <span id="userNameDisplay" style="font-size:13px; font-weight:700"></span>
        <button class="btn btn-outline" onclick="logout()" style="padding:8px 12px">Çıx</button>
      </div>
    </div>
  </div>
</header>

<div id="homeSection" class="section active">
  <section class="hero">
    <h1 id="heroTitle">Kitabını birbaşa sat.</h1>
    <div class="stats">
      <div class="stat-card"><span class="stat-num" id="stat-b">0</span><small>Kitab</small></div>
      <div class="stat-card"><span class="stat-num" id="stat-w">0</span><small>Yazar</small></div>
      <div class="stat-card"><span class="stat-num" id="stat-s">0</span><small>Satış</small></div>
    </div>
    <button class="btn btn-primary" onclick="handleAddBookClick()">+ Kitab Yerləşdir</button>
  </section>
  
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
    <h2 style="font-size:18px">Bütün Kitablar</h2>
    <select id="sortBooks" style="background:#16161f; color:#fff; border:1px solid var(--border); padding:5px; border-radius:8px" onchange="renderBooks()">
      <option value="new">Yenilər</option>
      <option value="top">Ən çox satılanlar</option>
    </select>
  </div>
  <div class="grid" id="bookGrid"></div>
</div>

<div id="adminSection" class="section">
  <h2>Admin Panel</h2>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px">
    <div class="stat-card" style="text-align:left">
      <h3>Yeni Yazıçı</h3>
      <div class="form-group"><input id="nwName" placeholder="Ad Soyad"></div>
      <div class="form-group"><input id="nwCode" placeholder="Giriş Kodu"></div>
      <div class="form-group"><input id="nwWa" placeholder="994705093416"></div>
      <button class="btn btn-primary" style="width:100%" onclick="createWriter()">Yarat</button>
    </div>
    <div class="stat-card" style="text-align:left">
      <h3>🏆 Top Yazıçılar (Satış sayına görə)</h3>
      <div id="topWritersList"></div>
    </div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="modal-content">
    <h3>Yazıçı Girişi</h3>
    <div class="form-group"><input type="password" id="lCode" placeholder="GİRİŞ KODU"></div>
    <button class="btn btn-primary" style="width:100%" onclick="login()">Daxil ol</button>
    <button class="btn btn-outline" style="width:100%; margin-top:10px" onclick="closeModal('loginModal')">Bağla</button>
  </div>
</div>

<div class="modal" id="bookModal">
  <div class="modal-content">
    <h3>Kitab Yerləşdir</h3>
    <div class="form-group"><input id="bTitle" placeholder="Kitab adı"></div>
    <div class="form-group"><input type="number" id="bPrice" placeholder="Qiymət (AZN)"></div>
    <div class="form-group"><input type="file" id="bFile" accept="image/*"></div>
    <button class="btn btn-primary" style="width:100%" onclick="saveBook()">Paylaş</button>
  </div>
</div>

<div class="modal" id="buyModal">
  <div class="modal-content">
    <h3 id="buyLabel"></h3>
    <div class="form-group"><input id="buyName" placeholder="Adınız"></div>
    <div class="form-group"><input id="buyPhone" placeholder="WhatsApp nömrəniz"></div>
    <button class="btn btn-primary" style="width:100%" onclick="completePurchase()">Sifariş ver</button>
  </div>
</div>

<nav class="tabbar">
  <div class="tab-btn active" id="tabHome" onclick="showTab('home')">🏠</div>
  <div class="tab-btn hidden" id="tabAdmin" onclick="showTab('admin')">⚙️</div>
</nav>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDXJe6-A2Y6tAZUji4Z0FBrY9N0fxmiqCM",
  authDomain: "yazarlaralsat.firebaseapp.com",
  projectId: "yazarlaralsat",
  storageBucket: "yazarlaralsat.firebasestorage.app",
  messagingSenderId: "743569857568",
  appId: "1:743569857568:web:021311e7fcbb9fadd9b045"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_KEY = "ADMIN2026";

let session = JSON.parse(localStorage.getItem('yz_session')) || null;
let writers = [], books = [], orders = [], currentB = null;

const showToast = (m) => { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 2500); };
const openModal = (id) => document.getElementById(id).classList.add('open');
const closeModal = (id) => document.getElementById(id).classList.remove('open');

function showTab(t) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(t + 'Section').classList.add('active');
  document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
}

async function login() {
  const code = document.getElementById('lCode').value.toUpperCase();
  const devId = localStorage.getItem('yz_device_token') || 'dv-'+Math.random().toString(36).substr(2,9);
  localStorage.setItem('yz_device_token', devId);

  if(code === ADMIN_KEY) {
    const lock = await db.collection("system_config").doc("admin_lock").get();
    if(lock.exists && lock.data().deviceId !== devId) return showToast("Admin girişi bağlıdır!");
    if(!lock.exists) await db.collection("system_config").doc("admin_lock").set({ deviceId: devId });
    session = { name: "Admin", role: "admin", id: "admin" };
  } else {
    const w = writers.find(x => x.code === code);
    if(!w) return showToast("Kod səhvdir!");
    session = { name: w.name, role: "writer", id: w.id, wa: w.wa };
  }
  localStorage.setItem('yz_session', JSON.stringify(session));
  location.reload();
}

function logout() { localStorage.removeItem('yz_session'); location.reload(); }

function init() {
  if(session) {
    document.getElementById('authHeader').classList.add('hidden');
    document.getElementById('userHeader').classList.remove('hidden');
    document.getElementById('userNameDisplay').innerText = session.name;
    if(session.role === 'admin') document.getElementById('tabAdmin').classList.remove('hidden');
    document.getElementById('heroTitle').innerText = `Xoş gəldin, ${session.name}!`;
  }

  db.collection("books").onSnapshot(s => {
    books = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderBooks();
    updateStats();
  });

  db.collection("writers").onSnapshot(s => {
    writers = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if(session?.role === 'admin') renderTopWriters();
    updateStats();
  });

  db.collection("orders").onSnapshot(s => {
    orders = s.docs.map(d => ({ id: d.id, ...d.data() }));
    updateStats();
  });
}

function renderBooks() {
  const g = document.getElementById('bookGrid');
  const sortType = document.getElementById('sortBooks').value;
  
  let sortedBooks = [...books];
  if(sortType === 'top') sortedBooks.sort((a,b) => (b.sales || 0) - (a.sales || 0));
  else sortedBooks.sort((a,b) => b.createdAt - a.createdAt);

  g.innerHTML = "";
  sortedBooks.forEach(b => {
    const isBestseller = b.sales >= 5; // 5-dən çox satılsa bestseller olur
    const mine = session && (session.id === b.writerId || session.role === 'admin');
    
    g.innerHTML += `
      <div class="book-card">
        <div class="img-shield"></div>
        ${isBestseller ? `<div class="badge">BESTSELLER</div>` : ''}
        ${mine ? `<button onclick="delDoc('books','${b.id}')" style="position:absolute;right:8px;top:8px;background:red;border:0;color:#fff;border-radius:6px;z-index:10;padding:4px 8px;font-size:10px;cursor:pointer">SİL</button>` : ''}
        <img class="book-img" src="${b.image || ''}">
        <div class="book-info">
          <div class="book-title">${b.title}</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="book-price">${b.price} AZN</span>
            <button class="btn btn-primary" style="padding:6px 12px;font-size:12px;z-index:11" onclick="buyBook('${b.id}')">Al</button>
          </div>
          <div class="book-sales">📈 ${b.sales || 0} satış</div>
        </div>
      </div>`;
  });
}

function renderTopWriters() {
  const list = document.getElementById('topWritersList');
  // Hər yazıçının ümumi satışını hesabla
  let stats = writers.map(w => {
    const writerSales = books.filter(b => b.writerId === w.id).reduce((acc, curr) => acc + (curr.sales || 0), 0);
    return { name: w.name, total: writerSales };
  });
  
  stats.sort((a,b) => b.total - a.total);
  
  list.innerHTML = stats.map((s, index) => `
    <div style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,193,7,${index === 0 ? 0.2 : 0.05}); border-radius:10px; margin-bottom:5px">
      <span>${index + 1}. ${s.name}</span>
      <span style="font-weight:900; color:var(--gold)">${s.total} kitab</span>
    </div>
  `).join('');
}

async function completePurchase() {
  const n = document.getElementById('buyName').value;
  const p = document.getElementById('buyPhone').value;
  if(!n || !p) return showToast("Məlumatları doldurun!");

  const w = writers.find(x => x.id === currentB.writerId);
  
  // Satış sayını Firebase-də artır
  await db.collection("books").doc(currentB.id).update({
    sales: firebase.firestore.FieldValue.increment(1)
  });

  await db.collection("orders").add({ 
    bookTitle: currentB.title, 
    buyer: n, 
    writerId: currentB.writerId,
    createdAt: Date.now() 
  });

  window.open(`https://wa.me/${w ? w.wa : '994705093416'}?text=Salam, ${currentB.title} kitabını almaq istəyirəm.`);
  closeModal('buyModal');
  showToast("Sifariş yazıçıya göndərildi!");
}

// Digər köməkçi funksiyalar (createWriter, delDoc, updateStats və s.) əvvəlki kodla eynidir...
async function createWriter() {
  const n = document.getElementById('nwName').value;
  const c = document.getElementById('nwCode').value.toUpperCase();
  const w = document.getElementById('nwWa').value;
  if(n && c && w) {
    await db.collection("writers").add({ name: n, code: c, wa: w, createdAt: Date.now() });
    showToast("Uğurlu!");
  }
}
function buyBook(id) { currentB = books.find(b => b.id === id); document.getElementById('buyLabel').innerText = currentB.title; openModal('buyModal'); }
async function delDoc(c, id) { if(confirm("Silinsin?")) await db.collection(c).doc(id).delete(); }
function updateStats() { 
  document.getElementById('stat-b').innerText = books.length; 
  document.getElementById('stat-w').innerText = writers.length; 
  document.getElementById('stat-s').innerText = orders.length; 
}
function handleAddBookClick() { if(!session) openModal('loginModal'); else openModal('bookModal'); }
async function saveBook() {
  const t = document.getElementById('bTitle').value;
  const p = document.getElementById('bPrice').value;
  const f = document.getElementById('bFile').files[0];
  if(!t || !p) return showToast("Məlumatlar tam deyil!");
  let img = "";
  if(f) {
    const reader = new FileReader();
    img = await new Promise(res => { reader.onload = () => res(reader.result); reader.readAsDataURL(f); });
  }
  await db.collection("books").add({
    title: t, price: p, image: img,
    writerId: session.id, writerName: session.name,
    createdAt: Date.now(), sales: 0
  });
  closeModal('bookModal');
}
init();
</script>
</body>
</html>
