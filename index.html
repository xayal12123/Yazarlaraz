<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>yazarlar.az — Müstəqil Yazarlar Platforması</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050507; --panel:#0c0c12; --gold:#FFC107; --orange:#FF6F00;
  --text:#EDEDF3; --muted:#9a9aab; --border:rgba(255,255,255,.1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter', sans-serif; background:var(--bg); color:var(--text);
  margin:0; padding:0; overflow-x:hidden; -webkit-user-select: none; user-select: none;
}

/* ŞƏKİL QORUMASI (Beton Texnologiyası) */
.book-img-container {
  width: 100%; aspect-ratio: 3/4; position: relative;
  background-size: cover; background-position: center;
  background-repeat: no-repeat; background-color: #111;
  -webkit-user-drag: none; user-drag: none;
}
.img-shield { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,0); cursor: default; }

.bg-glow{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
.bg-glow div{position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(100px); opacity:0.3}
.bg-glow div:nth-child(1){top:-10%; left:-10%; background:var(--orange)}
.bg-glow div:nth-child(2){bottom:-10%; right:-10%; background:var(--gold)}

.header{position:sticky; top:0; z-index:100; background:rgba(5,5,7,0.8); backdrop-filter:blur(20px); border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px; margin:0 auto; padding:15px 20px; display:flex; align-items:center; justify-content:space-between}
.logo{font-weight:900; font-size:24px; color:var(--gold); letter-spacing:-1px}
.logo span{color:#fff}

.btn{border:0; cursor:pointer; font-family:inherit; font-weight:700; padding:12px 20px; border-radius:14px; transition:0.2s; display:inline-flex; align-items:center; gap:8px; font-size:14px}
.btn-primary{background:linear-gradient(135deg, var(--gold), var(--orange)); color:#000}
.btn-outline{background:rgba(255,255,255,0.05); color:#fff; border:1px solid var(--border)}

.section{max-width:1200px; margin:0 auto; padding:20px; display:none}
.section.active{display:block}

.hero{text-align:center; padding:30px 20px; max-width:800px; margin:0 auto}
.hero h1{font-size:clamp(32px, 8vw, 60px); font-weight:900; margin:0 0 15px; letter-spacing:-1.5px}

.stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:20px 0}
.stat-card{background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:15px; border-radius:20px; text-align:center}
.stat-num{font-size:24px; font-weight:900; color:var(--gold); display:block}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(165px, 1fr)); gap:20px}
.book-card{background:var(--panel); border:1px solid var(--border); border-radius:24px; overflow:hidden; position:relative; transition:0.3s}
.book-card:hover{border-color:var(--gold)}

.badge{position:absolute; top:12px; left:12px; background:var(--gold); color:#000; padding:5px 10px; border-radius:10px; font-size:11px; font-weight:900; z-index:10; box-shadow:0 4px 15px rgba(0,0,0,0.4)}

.book-info{padding:15px}
.book-title{font-weight:800; font-size:15px; margin-bottom:8px; height:40px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.book-price{color:var(--gold); font-weight:900; font-size:18px}
.book-meta{font-size:11px; color:var(--muted); margin-top:8px; display:flex; justify-content:space-between}

/* Admin Panel Sifariş Siyahısı */
.order-row{background:rgba(255,255,255,0.03); padding:12px; border-radius:12px; border:1px solid var(--border); margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center}
.order-row:hover{background:rgba(255,255,255,0.08); border-color:var(--gold)}

.modal{position:fixed; inset:0; background:rgba(0,0,0,0.95); backdrop-filter:blur(12px); display:none; place-items:center; z-index:200; padding:20px}
.modal.open{display:grid}
.modal-content{background:var(--panel); border:1px solid var(--border); width:100%; max-width:400px; padding:30px; border-radius:28px; position:relative}

.form-group{margin-bottom:18px}
.form-group input{width:100%; padding:14px; background:#16161f; border:1px solid var(--border); border-radius:12px; color:#fff; outline:none; transition:0.2s}
.form-group input:focus{border-color:var(--gold)}

.tabbar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(12,12,18,0.9); backdrop-filter:blur(15px); border:1px solid var(--border); padding:8px; border-radius:22px; display:flex; gap:10px; z-index:90}
.tab-btn{width:56px; height:56px; border-radius:18px; display:grid; place-items:center; color:var(--muted); cursor:pointer}
.tab-btn.active{background:var(--gold); color:#000}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; padding:14px 28px; border-radius:15px; font-weight:900; z-index:300; display:none}
.hidden{display:none}
</style>
</head>
<body oncontextmenu="return false;">

<div class="bg-glow"><div></div><div></div></div>

<header class="header">
  <div class="header-inner">
    <div class="logo">yazarlar<span>.az</span></div>
    <div id="headerAuth"><button class="btn btn-outline" onclick="openModal('loginModal')">Giriş</button></div>
    <div id="headerUser" class="hidden">
      <div style="display:flex; align-items:center; gap:12px">
        <span id="userNameShow" style="font-size:14px; font-weight:800; color:var(--gold)"></span>
        <button class="btn btn-outline" onclick="logout()" style="padding:8px 12px">Çıx</button>
      </div>
    </div>
  </div>
</header>

<div id="homeSection" class="section active">
  <section class="hero">
    <h1 id="welcomeText">Kitabını birbaşa sat.</h1>
    <div class="stats">
      <div class="stat-card"><span class="stat-num" id="s-books">0</span><small>Kitab</small></div>
      <div class="stat-card"><span class="stat-num" id="s-writers">0</span><small>Yazar</small></div>
      <div class="stat-card" style="border-color:var(--gold)"><span class="stat-num" id="s-sales">0</span><small>Satış</small></div>
    </div>
    <div style="display:flex; gap:10px; justify-content:center">
        <button class="btn btn-primary" onclick="handleBookAddClick()">+ Kitab Yerləşdir</button>
        <select id="sortOrder" onchange="renderBooks()" style="background:var(--panel); color:#fff; border:1px solid var(--border); border-radius:12px; padding:0 10px">
            <option value="new">Yenilər</option>
            <option value="top">Bestsellerlər</option>
        </select>
    </div>
  </section>
  <div class="grid" id="bookGrid"></div>
</div>

<div id="adminSection" class="section">
  <h2 style="margin-bottom:25px">Admin Detallı Nəzarət</h2>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:25px">
    <div class="stat-card" style="text-align:left">
      <h3 style="color:var(--gold)">Yeni Yazıçı Yarad</h3>
      <div class="form-group"><input id="admWName" placeholder="Ad Soyad"></div>
      <div class="form-group"><input id="admWCode" placeholder="Giriş Kodu"></div>
      <div class="form-group"><input id="admWWa" placeholder="994705093416"></div>
      <button class="btn btn-primary" style="width:100%" onclick="adminCreateWriter()">Təsdiqlə</button>
    </div>
    <div class="stat-card" style="text-align:left">
      <h3 style="color:var(--gold)">Canlı Sifariş Tarixçəsi</h3>
      <div id="detailedOrderList" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="modal-content">
    <h3>Xoş Gəldiniz</h3>
    <div class="form-group"><input type="password" id="loginInp" placeholder="GİRİŞ KODU"></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Daxil ol</button>
    <button class="btn btn-outline" style="width:100%; margin-top:10px" onclick="closeModal('loginModal')">Bağla</button>
  </div>
</div>

<div class="modal" id="bookModal">
  <div class="modal-content">
    <h3>Yeni Kitab</h3>
    <div class="form-group"><input id="bookT" placeholder="Kitab adı"></div>
    <div class="form-group"><input type="number" id="bookP" placeholder="Qiymət (AZN)"></div>
    <div class="form-group"><input type="file" id="bookF" accept="image/*"></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleSaveBook()">Paylaş</button>
  </div>
</div>

<div class="modal" id="buyModal">
  <div class="modal-content">
    <h3 id="buyT">Sifariş</h3>
    <div class="form-group"><input id="buyN" placeholder="Adınız"></div>
    <div class="form-group"><input id="buyP" placeholder="WhatsApp nömrəniz"></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleFinalBuy()">WhatsApp Sifariş</button>
  </div>
</div>

<div class="modal" id="orderDetailModal">
  <div class="modal-content">
    <h3 style="color:var(--gold)">Sifariş Detalı</h3>
    <div id="orderDetailInfo" style="font-size:14px; line-height:1.8"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:20px" onclick="closeModal('orderDetailModal')">Bağla</button>
  </div>
</div>

<nav class="tabbar">
  <div class="tab-btn active" id="tabHome" onclick="changeSection('home')">🏠</div>
  <div class="tab-btn hidden" id="tabAdmin" onclick="changeSection('admin')">⚙️</div>
</nav>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDXJe6-A2Y6tAZUji4Z0FBrY9N0fxmiqCM",
  authDomain: "yazarlaralsat.firebaseapp.com",
  projectId: "yazarlaralsat",
  storageBucket: "yazarlaralsat.firebasestorage.app",
  messagingSenderId: "743569857568",
  appId: "1:743569857568:web:021311e7fcbb9fadd9b045"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_PASS = "ADMIN2026";

let session = JSON.parse(localStorage.getItem('yz_user')) || null;
let writers = [], books = [], orders = [], currentBook = null;

// IP & CIHAZ KILIDI
async function getIP() {
    try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; } catch(e) { return "unknown"; }
}
const getDID = () => {
    let id = localStorage.getItem('yz_did');
    if(!id) { id = 'dv-'+Math.random().toString(36).substr(2,9); localStorage.setItem('yz_did', id); }
    return id;
};

const showToast = (m) => { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 2500); };
const openModal = (id) => document.getElementById(id).classList.add('open');
const closeModal = (id) => document.getElementById(id).classList.remove('open');

function changeSection(s) {
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.getElementById(s + 'Section').classList.add('active');
    document.getElementById('tab' + s.charAt(0).toUpperCase() + s.slice(1)).classList.add('active');
}

async function handleLogin() {
    const code = document.getElementById('loginInp').value.toUpperCase();
    const did = getDID();
    const ip = await getIP();

    if(code === ADMIN_PASS) {
        const lock = await db.collection("system_config").doc("admin_lock").get();
        if(lock.exists && (lock.data().did !== did || lock.data().ip !== ip)) {
            showToast("Giriş Rədd Edildi! Admin cihazı kilidlidir.");
            return;
        } else if (!lock.exists) {
            await db.collection("system_config").doc("admin_lock").set({ did, ip });
        }
        session = { name: "Admin", role: "admin", id: "admin" };
    } else {
        const w = writers.find(x => x.code === code);
        if(!w) return showToast("Yanlış kod!");
        session = { name: w.name, role: "writer", id: w.id, wa: w.wa };
    }
    localStorage.setItem('yz_user', JSON.stringify(session));
    location.reload();
}

function logout() { localStorage.removeItem('yz_user'); location.reload(); }

function init() {
    if(session) {
        document.getElementById('headerAuth').classList.add('hidden');
        document.getElementById('headerUser').classList.remove('hidden');
        document.getElementById('userNameShow').innerText = session.name;
        if(session.role === 'admin') document.getElementById('tabAdmin').classList.remove('hidden');
    }

    db.collection("books").onSnapshot(s => {
        books = s.docs.map(d => ({ id: d.id, ...d.data() }));
        renderBooks(); updateStats();
    });

    db.collection("writers").onSnapshot(s => {
        writers = s.docs.map(d => ({ id: d.id, ...d.data() }));
        updateStats();
    });

    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(s => {
        orders = s.docs.map(d => ({ id: d.id, ...d.data() }));
        if(session?.role === 'admin') renderOrders();
        updateStats();
    });
}

function renderBooks() {
    const grid = document.getElementById('bookGrid');
    const order = document.getElementById('sortOrder').value;
    let sorted = [...books];
    if(order === 'top') sorted.sort((a,b) => (b.sales || 0) - (a.sales || 0));
    else sorted.sort((a,b) => b.createdAt - a.createdAt);

    grid.innerHTML = "";
    sorted.forEach(b => {
        const isBestseller = (b.sales || 0) >= 5;
        const mine = session && (session.id === b.writerId || session.role === 'admin');
        grid.innerHTML += `
            <div class="book-card">
                <div class="img-shield"></div>
                ${isBestseller ? `<div class="badge">BESTSELLER</div>` : ''}
                ${mine ? `<button onclick="handleDelete('books','${b.id}')" style="position:absolute; right:8px; top:8px; background:red; border:0; color:#fff; border-radius:8px; z-index:15; padding:4px 8px; font-size:10px; cursor:pointer">SİL</button>` : ''}
                <div class="book-img-container" style="background-image: url('${b.image || ''}')"></div>
                <div class="book-info">
                    <div class="book-title">${b.title}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:20">
                        <span class="book-price">${b.price} AZN</span>
                        <button class="btn btn-primary" onclick="handleBuyClick('${b.id}')">Al</button>
                    </div>
                    <div style="font-size:11px; color:var(--muted); margin-top:8px">👤 ${b.writerName} | 📈 ${b.sales || 0} satış</div>
                </div>
            </div>`;
    });
}

function renderOrders() {
    const list = document.getElementById('detailedOrderList');
    if(!orders.length) { list.innerHTML = "<small>Sifariş yoxdur.</small>"; return; }
    list.innerHTML = orders.map(o => `
        <div class="order-row" onclick="viewOrderDetail('${o.id}')">
            <div><b>${o.bookTitle}</b><br><small>${o.buyer} — ${new Date(o.createdAt).toLocaleDateString()}</small></div>
            <span style="color:var(--gold)">›</span>
        </div>
    `).join('');
}

function viewOrderDetail(id) {
    const o = orders.find(x => x.id === id);
    const writer = writers.find(x => x.id === o.writerId);
    document.getElementById('orderDetailInfo').innerHTML = `
        <p><strong>Kitab:</strong> ${o.bookTitle}</p>
        <p><strong>Alıcı:</strong> ${o.buyer}</p>
        <p><strong>Nömrə:</strong> ${o.phone || 'Qeyd edilməyib'}</p>
        <p><strong>Yazıçı:</strong> ${writer ? writer.name : 'Naməlum'}</p>
        <p><strong>Tarix:</strong> ${new Date(o.createdAt).toLocaleString()}</p>
    `;
    openModal('orderDetailModal');
}

async function handleFinalBuy() {
    const n = document.getElementById('buyN').value, p = document.getElementById('buyP').value;
    if(!n || !p) return showToast("Doldurun!");
    const w = writers.find(x => x.id === currentBook.writerId);
    await db.collection("books").doc(currentBook.id).update({ sales: firebase.firestore.FieldValue.increment(1) });
    await db.collection("orders").add({ bookTitle: currentBook.title, buyer: n, phone: p, writerId: currentBook.writerId, createdAt: Date.now() });
    window.open(`https://wa.me/${w ? w.wa : '994705093416'}?text=Salam, ${currentBook.title} sifariş edirəm. Adım: ${n}`);
    closeModal('buyModal');
}

async function adminCreateWriter() {
    const n = document.getElementById('admWName').value, c = document.getElementById('admWCode').value.toUpperCase(), w = document.getElementById('admWWa').value;
    if(n && c && w) { await db.collection("writers").add({ name: n, code: c, wa: w, createdAt: Date.now() }); showToast("Yazıçı yaradıldı!"); }
}

async function handleSaveBook() {
    const t = document.getElementById('bookT').value, p = document.getElementById('bookP').value, f = document.getElementById('bookF').files[0];
    if(!t || !p) return showToast("Məlumatı doldurun!");
    let base64 = "";
    if(f) { const reader = new FileReader(); base64 = await new Promise(r => { reader.onload = () => r(reader.result); reader.readAsDataURL(f); }); }
    await db.collection("books").add({ title: t, price: p, image: base64, writerId: session.id, writerName: session.name, createdAt: Date.now(), sales: 0 });
    closeModal('bookModal');
}

async function handleDelete(col, id) { if(confirm("Silinsin?")) await db.collection(col).doc(id).delete(); }
function updateStats() { document.getElementById('s-books').innerText = books.length; document.getElementById('s-writers').innerText = writers.length; document.getElementById('s-sales').innerText = orders.length; }
function handleBookAddClick() { if(!session) openModal('loginModal'); else openModal('bookModal'); }
function handleBuyClick(id) { currentBook = books.find(x => x.id === id); document.getElementById('buyT').innerText = currentBook.title; openModal('buyModal'); }

init();
</script>
</body>
</html>
